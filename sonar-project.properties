# =============================================================================
# SonarQube Configuration
# Generated by opencode-sonarqube plugin
# =============================================================================

# Project Identification
sonar.projectKey=opencode-sonarqube
sonar.projectName=opencode-sonarqube

# Source Configuration - ALWAYS scans entire project
sonar.sources=.
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs,**/*.py,**/*.java,**/*.go,**/*.rs,**/*.php,**/*.rb,**/*.cs,**/*.vb,**/*.cpp,**/*.c,**/*.h,**/*.hpp,**/*.swift,**/*.kt,**/*.scala,**/*.groovy,**/*.html,**/*.css,**/*.scss,**/*.less,**/*.vue,**/*.svelte,**/*.xml,**/*.json,**/*.yaml,**/*.yml
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/*.d.ts,**/*.min.js,**/*.min.css,**/vendor/**,**/__pycache__/**,**/.venv/**,**/venv/**,**/target/**,**/examples/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.spec.jsx,**/__tests__/**,**/__mocks__/**

# Language-Specific Configuration

# TypeScript/JavaScript
sonar.typescript.tsconfigPaths=**/tsconfig.json
sonar.javascript.node.maxspace=4096

# Analysis Settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.spec.jsx,**/__tests__/**,**/__mocks__/**
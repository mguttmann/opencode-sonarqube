name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # Required for creating GitHub releases

env:
  NODE_VERSION: '22'
  BUN_VERSION: 'latest'

jobs:
  # =============================================================================
  # STAGE 1: Build & Test
  # =============================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Build
        run: bun run build

      - name: Check if release
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            coverage/
          retention-days: 1

  # =============================================================================
  # STAGE 2: SonarQube Analysis (Quality Gate)
  # =============================================================================
  quality:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx sonarqube-scanner \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=opencode-sonarqube \
            -Dsonar.qualitygate.wait=true

      - name: Verify Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sleep 5
          
          RESPONSE=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=opencode-sonarqube")
          
          QG_STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status')
          echo "Quality Gate: $QG_STATUS"
          
          if [ "$QG_STATUS" != "OK" ]; then
            echo "::error::Quality Gate FAILED"
            echo ""
            echo "Failed conditions:"
            echo "$RESPONSE" | jq '.projectStatus.conditions[] | select(.status != "OK")'
            exit 1
          fi
          
          echo "::notice::Quality Gate PASSED"

  # =============================================================================
  # STAGE 3: Publish to npm (only on tags, after quality gate passes)
  # =============================================================================
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, quality]
    if: needs.build.outputs.is_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${{ needs.build.outputs.version }}
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! package.json: $PKG_VERSION, tag: $TAG_VERSION"
            echo "Update package.json version to $TAG_VERSION before creating the tag."
            exit 1
          fi
          
          echo "Version verified: $TAG_VERSION"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ needs.build.outputs.version }}
          body: |
            ## opencode-sonarqube v${{ needs.build.outputs.version }}
            
            ### Installation
            ```bash
            bun add opencode-sonarqube@${{ needs.build.outputs.version }}
            # or
            npm install opencode-sonarqube@${{ needs.build.outputs.version }}
            ```
            
            ### Links
            - [npm package](https://www.npmjs.com/package/opencode-sonarqube)
            - [Documentation](https://github.com/mguttmann/opencode-sonarqube#readme)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Published opencode-sonarqube@${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [npm](https://www.npmjs.com/package/opencode-sonarqube/v/${{ needs.build.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/mguttmann/opencode-sonarqube/releases/tag/v${{ needs.build.outputs.version }})" >> $GITHUB_STEP_SUMMARY
